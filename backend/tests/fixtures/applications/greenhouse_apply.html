<!DOCTYPE html>
<html>
<body>
<form id="application_form">
  <label for="first_name">First Name</label>
  <input type="text" id="first_name" name="first_name">
  <label for="last_name">Last Name</label>
  <input type="text" id="last_name" name="last_name">
  <label for="email">Email</label>
  <input type="email" id="email" name="email">
  <label for="phone">Phone</label>
  <input type="text" id="phone" name="phone">
  <label for="resume">Resume/CV</label>
  <input type="file" id="resume" name="resume">
  <label for="cover_letter">Cover Letter</label>
  <textarea id="cover_letter" name="cover_letter"></textarea>
  <label for="referral">How did you hear about us?</label>
  <input type="text" id="referral" name="referral">
  <button id="submit_app" type="button" onclick="document.getElementById('submitted').style.display='block'">Submit Application</button>
</form>
<div id="submitted" style="display:none">Submitted!</div>
</body>
</html>
