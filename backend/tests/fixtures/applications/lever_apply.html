<!DOCTYPE html>
<html>
<body>
<form>
  <label for="name">Full Name</label>
  <input type="text" id="name" name="name">
  <label for="email">Email</label>
  <input type="email" id="email" name="email">
  <label for="phone">Phone</label>
  <input type="text" id="phone" name="phone">
  <label for="resume">Resume/CV</label>
  <input type="file" id="resume" name="resume">
  <label for="additional-info">Additional Information</label>
  <textarea id="additional-info"></textarea>
  <button class="postings-btn-submit" type="button" onclick="document.getElementById('submitted').style.display='block'">Submit Application</button>
</form>
<div id="submitted" style="display:none">Submitted!</div>
</body>
</html>
