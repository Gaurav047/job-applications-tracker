[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-rag"
version = "0.1.0"
description = "RAG layer for tailored resume generation; imports backend's app package directly."
requires-python = ">=3.9"
dependencies = [
    "voyageai==0.3.2",
    "pgvector==0.3.6",
]

[tool.setuptools]
packages = ["rag"]
